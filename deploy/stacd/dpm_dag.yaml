# =============================================================================
# DPM (Drone Phenology Monitoring) — STACD DAG definition
#
# Rewritten 2026-10-09 to target the STACD_framework schema
# (github.com/SaharshLaud/STACD_framework), which is the framework that
# actually EXECUTES algorithms via an API/Docker callback — unlike
# STACD-Airflow, whose tasks are lineage/bookkeeping stubs that never call a
# service. DPM needs real execution (the pipeline runs and returns a STAC
# Item), so STACD_framework is the correct target.
#
# KEY CHANGES vs the previous draft:
#   - REMOVED the DPM_Orthomosaic_Series root-input dataset node.
#       Reason: a dataset node that no algorithm produces is treated as a ROOT
#       dataset, and the generator emits a fetch_<id> task that calls
#       db.get_root_dataset(type_id, state, district, block). DPM has no
#       state/district/block and no pre-registered GEE/GeoServer asset for the
#       orthomosaics, so that task would fail ("Root dataset not found").
#       DPM's orthomosaics are staged out-of-band (user upload -> run_id) and
#       are NOT a STACD dataset. This mirrors Custom LULC ("no root input; the
#       inputs travel as params"). The algorithm now has input_datasets: [].
#   - The single algorithm (Phenology_Export) is a ROOT algorithm (consumes no
#       datasets), so the generated DAG has no fetch task — it just runs the
#       algorithm, then registers the one output (DPM_Phenology_Vector).
#
# PARAMETER FLOW (how these fields are used by the generator):
#   - !DAG.params        -> the Airflow trigger-conf schema (conf keys + default
#                           values). Must contain every param name.
#   - !Algorithm_Type.params -> the list the generator turns into the HTTP POST
#                           body sent to the algorithm's api `url`
#                           (/api/export-phenology). THIS is the authoritative
#                           payload list; it must stay in sync with the backend's
#                           ExportPhenologyReq pydantic model AND the UI AND the
#                           pipeline command builder.
#   The backend already triggers with conf = {"run_id": run_id, **params}, so
#   the conf keys match these names 1:1.
#
# NOTE (benign quirk): because a param is literally named `run_id`, the
#   generated task reassigns the Airflow run id with the DPM run_id, so the
#   payload's `execution_id` equals the DPM run_id. That is harmless for DPM
#   (it makes execution_id directly traceable to db.runs).
# =============================================================================

--- !DAG
id: drone_phenology_monitoring
name: Drone Phenology Monitoring — Phenophase Export
version: "1.2"
description: >
  Single-algorithm DAG. Operates on a staged run (orthomosaics already uploaded
  via the DPM dashboard, identified by run_id) and runs the full phenology
  pipeline, producing a per-crown phenophase vector layer as a STAC Item.
  DPM does not take state/district/block/year like LULC/Terrain — the only
  required field is run_id; all pipeline-tuning parameters are optional and
  fall back to the pipeline/UI defaults.
params:
  - run_id                    # required — identifies the staged run in db.runs
  # --- Detection (01_crown_detection) ---
  - model_type                # Detectree2 variant: 250312_flexi | urban_canopy | tropical_dense
  - tile_width                # inference tile width in metres (default: 25)
  - tile_height               # inference tile height in metres (default: 25)
  - tile_buffer               # tile overlap in metres (default: 15)
  - fixed_iou                 # IoU threshold for clean_crowns (default: 0.7)
  # --- Tracking (02_crown_tracking) ---
  - base_threshold_tag        # crown-matching confidence 0-100 (default: 45)
  - align_threshold_tag       # alignment anchor confidence 0-100 (default: 65)
  - align_method              # alignment method (default: pcc_tiled)
  # --- Phenology (03_phenology_analysis) ---
  - w_veg_amp                 # DS weight: vegetation amplitude
  - w_depth                   # DS weight: seasonal depth
  - w_gcc_amp                 # DS weight: GCC amplitude
  - w_tex                     # DS weight: texture
  # --- Advanced ---
  - exclude_stems             # comma-separated stems to skip
  - skip_viz                  # skip tracking visualizations (default: true)

alg_type_nodes:
  - Phenology_Export

dataset_type_nodes:
  - DPM_Phenology_Vector

# ═══════════════════════════════════════════════
# DATASET TYPES
# ═══════════════════════════════════════════════

--- !Dataset_Type
id: DPM_Phenology_Vector
name: DPM Phenology Vector
description: >
  Output. Per-crown phenophase classification vector
  (tree_master_geojson_phenoclf.geojson) with leaf-on/leaf-off timing per crown.
  Published as a STAC Item (table extension) by the /api/export-phenology
  callback and registered automatically by STACD during the run.
format: GeoServerLayer

# ═══════════════════════════════════════════════
# ALGORITHM TYPES
# ═══════════════════════════════════════════════

--- !Algorithm_Type
id: Phenology_Export
name: Phenology_Export
description: >
  Runs the full DPM pipeline (crown detection -> tracking -> phenology analysis
  -> phenophase classification -> COG tiling -> vector export) on the staged
  orthomosaic series (resolved from run_id) and returns the phenophase vector as
  a STAC Item. Root algorithm: consumes no STACD datasets (orthomosaics are
  staged out-of-band), so input_datasets is empty.
params:
  - name: run_id
    type: string
  - name: model_type
    type: string
  - name: tile_width
    type: integer
  - name: tile_height
    type: integer
  - name: tile_buffer
    type: integer
  - name: fixed_iou
    type: float
  - name: base_threshold_tag
    type: string
  - name: align_threshold_tag
    type: string
  - name: align_method
    type: string
  - name: w_veg_amp
    type: float
  - name: w_depth
    type: float
  - name: w_gcc_amp
    type: float
  - name: w_tex
    type: float
  - name: exclude_stems
    type: string
  - name: skip_viz
    type: boolean
input_datasets: []
outputs:
  - DPM_Phenology_Vector
depends_on: []
