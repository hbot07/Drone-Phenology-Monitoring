# =============================================================================
# DPM — STACD Root Dataset Instance Repository
#
# Rewritten 2026-10-09 for the STACD_framework schema.
#
# THIS FILE IS INTENTIONALLY EMPTY (no !Dataset_Instance entries).
#
# WHY:
#   The dataset repo registers ROOT datasets only — pre-existing inputs that no
#   algorithm produces (e.g. a public GEE asset), using the schema:
#       --- !Dataset_Instance
#       type_id: <a Dataset_Type id>
#       version: "1"
#       region:  <region key>
#       asset_id: "projects/.../assets/..."   # a real, fetchable asset
#       metadata: {...}
#
#   DPM has NO such root dataset. Its only input — a time series of drone
#   orthomosaics — is uploaded through the dashboard and staged against a
#   run_id; it is never a pre-registered GEE/GeoServer asset. So there is
#   nothing to register here. (This is the Custom LULC pattern: "no root
#   input; the inputs travel as params".)
#
#   The single OUTPUT dataset (DPM_Phenology_Vector) is NOT registered here
#   either — STACD registers algorithm outputs automatically during the run,
#   from the STAC Item returned by /api/export-phenology.
#
# NOTE: the earlier draft of this file used the STACD-Airflow schema
#   (type / params / alg_name / alg_inputs / input_datasets / date). That schema
#   belongs to the older STACD-Airflow *prototype* (bookkeeping only, no real
#   execution) and is NOT valid in STACD_framework. It has been removed.
#
# If the cluster's init tooling requires at least one entry, re-add a single
# correctly-shaped root dataset here (type_id / version / region / asset_id),
# but for DPM that should not be necessary.
# =============================================================================
