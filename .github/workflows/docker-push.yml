# =============================================================================
# Build the deps-only image and push it to Docker Hub.
# CoRE Stack cluster-docker-services §5: "Push to GHCR or Docker Hub. Tag images
# with the same number (:1.2.0), not only :latest."
#
# The image is DEPS-ONLY — it never contains application source. On the cluster,
# the checkout is mounted at runtime; a code change is a `git pull` + restart,
# and only a dependency change (Dockerfile / requirements) needs a rebuild. So
# this runs on pushes that touch the Dockerfile or requirements, on a version
# tag, or manually.
#
# ---------------------------------------------------------------------------
# REQUIRED repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      a Docker Hub access token with Read/Write/Delete
#                        (Docker Hub -> Account Settings -> Personal access tokens)
# Optional repo variable (Settings -> Secrets and variables -> Actions -> Variables):
#   DOCKERHUB_IMAGE      full image name, default "<username>/dpm-pipeline"
# ---------------------------------------------------------------------------
# Tags pushed:  :<VERSION file>  +  :latest  +  :sha-<git-sha>   (and :<git-tag> on a v* tag)
# =============================================================================
name: Build and push image to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "requirements/**"
      - "VERSION"
      - ".github/workflows/docker-push.yml"
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Derive image name and version
        id: meta
        run: |
          # Image name: the DOCKERHUB_IMAGE variable, else "<username>/dpm-pipeline".
          img="${{ vars.DOCKERHUB_IMAGE }}"
          if [ -z "$img" ]; then
            img="${{ secrets.DOCKERHUB_USERNAME }}/dpm-pipeline"
          fi
          echo "image=${img}" >> "$GITHUB_OUTPUT"
          # First token of the VERSION file's first line, e.g. "1.0.0".
          if [ -f VERSION ]; then
            ver=$(head -n1 VERSION | awk '{print $1}')
          else
            ver="0.0.0"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Image:   ${img}"
          echo "Version: ${ver}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Drone Phenology Monitoring
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
