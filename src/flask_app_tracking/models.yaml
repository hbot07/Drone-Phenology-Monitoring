# DPM Model Manifest
# ------------------
# Add a new detector by dropping the .pth file into your ./models/ folder
# (mounted at /app/models/ in Docker) and adding an entry here.
# The "file" field is looked up under the models_dir (DPM_MODELS_DIR or /app/models/).
# Set "default: true" on exactly one entry.

detectors:
  flexi:
    file: 250312_flexi.pth
    description: "Flexible multi-site model"
    default: true
  tropical_closed:
    file: 250711_tropical_closed_canopy.pth
    description: Dense tropical forest only.
  urban_cambridge:
    file: urban_trees_Cambridge_20230630.pth
    description: Urban trees, Cambridge UK (2023-06-30).
  paracou:
    file: 220723_withParacouUAV.pth
    description: Tropical canopy, Paracou UAV (2022-07-23).
  randresize:
    file: 230103_randresize_full.pth
    description: Random-resize full model (2023-01-03).
